<div class="editorial-shop-toolbar">
  <div class="editorial-toolbar-left">
    <button type="button" class="editorial-filter-button"
            (click)="openSidebar.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" aria-hidden="true">
        <path d="M4 7h16M4 17h16"/>
        <circle cx="9" cy="7" r="2" fill="white"/>
        <circle cx="15" cy="17" r="2" fill="white"/>
      </svg>
      <span>Filtrar</span>
    </button>

    <span class="editorial-product-count">
      {{ products.length }} {{ products.length === 1 ? 'producto' : 'productos' }}
    </span>
  </div>

  <div class="editorial-toolbar-right">
    <div class="editorial-sort">
      <label for="SortBy">ORDENAR POR:</label>
      <select id="SortBy" name="SortBy"
              [value]="currentSortBy"
              (change)="onSortChange($event)">
        <option value="featured">Los más vendidos</option>
        <option value="title-ascending">Alfabéticamente, A-Z</option>
        <option value="title-descending">Alfabéticamente, Z-A</option>
        <option value="price-ascending">Precio, de menor a mayor</option>
        <option value="price-descending">Precio, de mayor a menor</option>
        <option value="created-ascending">Fecha, de antigua a nueva</option>
        <option value="created-descending">Fecha, de nueva a antigua</option>
      </select>
    </div>

    <div class="editorial-grid-controls" role="group"
         aria-label="Visualización de productos">

      <button type="button"
              class="editorial-grid-button mobile-view"
              [class.active]="currentGridView.columns === 1"
              [attr.aria-pressed]="currentGridView.columns === 1"
              aria-label="Ver productos en 1 columna"
              (click)="setGridView(1)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="3"/><rect x="3" y="10" width="18" height="3"/><rect x="3" y="16" width="18" height="3"/></svg>
      </button>

      <button type="button"
              class="editorial-grid-button mobile-view"
              [class.active]="currentGridView.columns === 2"
              [attr.aria-pressed]="currentGridView.columns === 2"
              aria-label="Ver productos en 2 columnas"
              (click)="setGridView(2)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="18"/><rect x="13" y="3" width="8" height="18"/></svg>
      </button>

      <button type="button"
              class="editorial-grid-button desktop-view"
              [class.active]="currentGridView.columns === 3"
              [attr.aria-pressed]="currentGridView.columns === 3"
              aria-label="Ver productos en 3 columnas"
              (click)="setGridView(3)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="5" height="18"/><rect x="9.5" y="3" width="5" height="18"/><rect x="17" y="3" width="5" height="18"/></svg>
      </button>

      <button type="button"
              class="editorial-grid-button desktop-view"
              [class.active]="currentGridView.columns === 4"
              [attr.aria-pressed]="currentGridView.columns === 4"
              aria-label="Ver productos en 4 columnas"
              (click)="setGridView(4)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="4" height="18"/><rect x="7.5" y="3" width="4" height="18"/><rect x="13" y="3" width="4" height="18"/><rect x="18.5" y="3" width="4" height="18"/></svg>
      </button>

      <button type="button"
              class="editorial-grid-button desktop-view"
              [class.active]="currentGridView.columns === 5"
              [attr.aria-pressed]="currentGridView.columns === 5"
              aria-label="Ver productos en 5 columnas"
              (click)="setGridView(5)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="3" height="18"/><rect x="6.25" y="3" width="3" height="18"/><rect x="10.5" y="3" width="3" height="18"/><rect x="14.75" y="3" width="3" height="18"/><rect x="19" y="3" width="3" height="18"/></svg>
      </button>
    </div>
  </div>
</div>
