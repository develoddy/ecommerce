<app-store-loader
  *ngIf="editorialLoading || (loader.loading$ | async)">
</app-store-loader>

<div class="editorial-page"
     [class.editorial-is-loading]="editorialLoading || (loader.loading$ | async)"
     [attr.aria-busy]="editorialLoading || (loader.loading$ | async)"
     [attr.inert]="(editorialLoading || (loader.loading$ | async)) ? '' : null">

  <!-- HEADER COMPARTIDO -->
  <app-header></app-header>

  <!-- CAMPAÑA EDITORIAL -->
  <main>

    <section class="editorial-hero" aria-labelledby="editorial-title">

      <picture
        *ngIf="editorialBanner as banner"
        class="editorial-hero-picture"
        aria-hidden="true">

        <source
          media="(max-width: 767px)"
          [attr.srcset]="banner.imagen_mobile_url">

        <img
          [src]="banner.imagen_desktop_url"
          alt=""
          loading="eager"
          (load)="onEditorialImageLoad()"
          (error)="onEditorialImageError()">

      </picture>

      <picture
        *ngIf="useEditorialFallback && !editorialImageFailed"
        class="editorial-hero-picture"
        aria-hidden="true">

        <img
          src="assets/images/store-editorial/store-editorial-hero.png"
          alt=""
          loading="eager"
          (load)="onEditorialImageLoad()"
          (error)="onEditorialFallbackError()">

      </picture>

      <picture
        *ngFor="let campaign of readyEditorialCampaigns; trackBy: trackEditorialCampaign"
        class="editorial-hero-picture editorial-campaign-layer"
        [class.editorial-campaign-active]="activeEditorialCategory === campaign.category"
        aria-hidden="true">

        <img
          [src]="campaign.url"
          alt="">

      </picture>

      <div class="editorial-hero-overlay"></div>

      <div class="editorial-hero-content">

        <span class="editorial-eyebrow">
          THE DEVELOPER COLLECTION
        </span>

        <h1 id="editorial-title">
          Diseño para<br>
          quienes construyen.
        </h1>

        <nav class="editorial-hero-categories" aria-label="Explorar colecciones">

          <button type="button"
                  (mouseenter)="previewEditorialCategory('t-shirts')"
                  (mouseleave)="resetEditorialCategory()"
                  (focus)="previewEditorialCategory('t-shirts')"
                  (blur)="resetEditorialCategory()"
                  (click)="selectCategory('t-shirts')">
            T-SHIRTS
          </button>

          <button type="button"
                  (mouseenter)="previewEditorialCategory('hoodies')"
                  (mouseleave)="resetEditorialCategory()"
                  (focus)="previewEditorialCategory('hoodies')"
                  (blur)="resetEditorialCategory()"
                  (click)="selectCategory('hoodies')">
            HOODIES
          </button>

          <button type="button"
                  (mouseenter)="previewEditorialCategory('mugs')"
                  (mouseleave)="resetEditorialCategory()"
                  (focus)="previewEditorialCategory('mugs')"
                  (blur)="resetEditorialCategory()"
                  (click)="selectCategory('mugs')">
            MUGS
          </button>

          <button type="button"
                  (mouseenter)="previewEditorialCategory('caps')"
                  (mouseleave)="resetEditorialCategory()"
                  (focus)="previewEditorialCategory('caps')"
                  (blur)="resetEditorialCategory()"
                  (click)="selectCategory('caps')">
            CAPS
          </button>

          <button *ngIf="false"
                  type="button"
                  (mouseenter)="resetEditorialCategory()"
                  (focus)="resetEditorialCategory()"
                  (click)="openStore()">
            SHOP
          </button>

        </nav>

      </div>

    </section>

    <!-- NEWSLETTER: PRESENTACIÓN VISUAL -->
    <section class="editorial-newsletter">

      <h2>
        Recibe novedades, lanzamientos y colecciones exclusivas.
      </h2>

      <p>
        Descubre lo próximo de LujanDev.
      </p>

      <button
        type="button"
        class="editorial-newsletter-cta"
        (click)="openStore()">
        EXPLORAR LA TIENDA
      </button>

    </section>

  </main>

  <!-- Footer compartido del ecommerce -->
  <app-footer></app-footer>

</div>
