<!-- Storytelling / Brand Message -->
<div class="page-header mb-0 bg-darkblue-ld py-7">
  <div class="container py-5">
    <!-- Bloque centrado -->
    <div class="row mb-5 justify-content-center text-center">
      <div class="col-12 col-md-10 col-lg-8">
        <span class="build-continues-label">
          LUJANDEV / BUILT IN PUBLIC
        </span>

        <h2 class="text-white mb-3 lh-1 build-continues-title" [ngClass]="{'fs-22': isMobile, 'fs-32': isDesktop}">
          EL BUILD<br>
          CONTINÚA.
        </h2>
        <p class="lead text-white lh-1 build-continues-copy">
          Nuevos bugs. Nuevos deploys.<br>
          Nuevas historias que pueden terminar<br>
          convertidas en el siguiente diseño.
        </p>
      </div>
    </div>

    <!-- Newsletter (Solo para usuarios Guest) -->
    <div class="row justify-content-center text-center" *ngIf="isGuest">
      <div class="col-12 col-md-8 col-lg-6">
        <p class="text-white mb-3 lh-1 mb-3 fs-12 build-continues-newsletter-label">
          BUILD LOGS. NUEVOS DROPS. SIN SPAM.
        </p>
        
        <!-- Success Message -->
        <div class="alert alert-success text-center mb-3" *ngIf="showSuccessMessage">
          <i class="fas fa-check-circle me-2"></i>
          ¡Ya estás dentro del build!
        </div>

        <!-- Error Message -->
        <div class="alert alert-danger text-center mb-3" *ngIf="showErrorMessage">
          <i class="fas fa-exclamation-triangle me-2"></i>
          {{ errorMessage }}
        </div>

        <!-- Newsletter Form -->
        <form (ngSubmit)="onSubmitNewsletter()" *ngIf="!showSuccessMessage">
          <div class="input-group position-relative" [ngClass]="{'d-flex': isMobile}">
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              class="form-control bg-transparent border-0 border-bottom border-white text-white rounded-0 shadow-none px-0 pe-5"
              [ngClass]="{'w-100': isMobile}"
              placeholder="Introduce tu correo electrónico"
              [disabled]="isSubmitting"
              autocomplete="email"
              required
            />
            <button 
              type="submit" 
              class="btn-subscribe position-absolute px-0 fw-normal"
              [disabled]="isSubmitting"
              style="z-index: 10;"
            >
              <span *ngIf="!isSubmitting">ÚNETE AL BUILD →</span>
              <span *ngIf="isSubmitting">
                <i class="fas fa-spinner fa-spin"></i>
              </span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- End Storytelling / Brand Message -->
