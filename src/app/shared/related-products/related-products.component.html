<app-product-recommendations
    *ngIf="related_products && related_products.length > 0"
    [products]="related_products"
    translationPrefix="product_detail.related_products"
    [euro]="euro"
    [SALE_FLASH]="SALE_FLASH"
    (navigateToProduct)="navigateToProduct.emit($event)">
</app-product-recommendations>
